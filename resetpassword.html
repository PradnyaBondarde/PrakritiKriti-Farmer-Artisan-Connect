<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - PrakritiKriti</title>
    <style>
        :root {
            --primary-color: #4caf50;
            --primary-light: #80e27e;
            --primary-dark: #087f23;
            --white: #ffffff;
            --error: #ff3333;
            --text-color: #333333;
        }

        body {
            background: url('') no-repeat center center fixed;
            background-size: cover;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }

        h1 {
            color: var(--primary-dark);
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }

        input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px var(--primary-light);
        }

        .error {
            color: var(--error);
            font-size: 0.875rem;
            margin-top: 0.25rem;
            display: none;
        }

        button {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 1rem;
        }

        button:hover {
            background: var(--primary-dark);
        }

        .back-to-login {
            text-align: center;
            margin-top: 1rem;
        }

        .back-to-login a {
            color: var(--primary-color);
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Reset Password</h1>
        <form id="resetForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
                <span class="error" id="emailError"></span>
            </div>
            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" required>
                <span class="error" id="newPasswordError"></span>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" required>
                <span class="error" id="confirmPasswordError"></span>
            </div>
            <button type="submit">Change Password</button>
        </form>
        <div class="back-to-login">
            <a href="login.html">Back to Login</a>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const firebaseConfig = {
                apiKey: "AIzaSyCgvhMdnHX9yVvMBJdh3uaBYbUIdPtD9_k",
                authDomain: "prakritikriti-d5603.firebaseapp.com",
                databaseURL: "https://prakritikriti-d5603-default-rtdb.firebaseio.com",
                projectId: "prakritikriti-d5603",
                storageBucket: "prakritikriti-d5603.firebasestorage.app",
                messagingSenderId: "1050876813362",
                appId: "1:1050876813362:web:38ffd26d667ff4a8dddc2b"
            };

            firebase.initializeApp(firebaseConfig);
            const auth = firebase.auth();
            const database = firebase.database();

            const resetForm = document.getElementById('resetForm');

            resetForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearErrors();

                const email = document.getElementById('email').value;
                const newPassword = document.getElementById('newPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                // Validate passwords match
                if (newPassword !== confirmPassword) {
                    showError('confirmPasswordError', 'Passwords do not match');
                    return;
                }

                // Validate password strength
                if (newPassword.length < 6) {
                    showError('newPasswordError', 'Password must be at least 6 characters');
                    return;
                }

                try {
                    // Find user with this email
                    const usersRef = database.ref('users');
                    const snapshot = await usersRef.once('value');
                    const users = snapshot.val();

                    let userKey = null;
                    let userData = null;

                    Object.entries(users).forEach(([key, user]) => {
                        if (user.email === email) {
                            userKey = key;
                            userData = user;
                        }
                    });

                    if (!userKey || !userData) {
                        showError('emailError', 'Email not found');
                        return;
                    }

                    // Update password in Firebase Authentication
                    const user = await auth.signInWithEmailAndPassword(email, userData.password);
                    await user.user.updatePassword(newPassword);

                    // Update password in database
                    await database.ref(`users/${userKey}`).update({
                        password: newPassword
                    });

                    // Show success message
                    alert('Password changed successfully!');
                    window.location.href = 'login.html';

                } catch (error) {
                    console.error('Reset error:', error);
                    handleResetError(error);
                }
            });

            function showError(elementId, message) {
                const errorElement = document.getElementById(elementId);
                if (errorElement) {
                    errorElement.textContent = message;
                    errorElement.style.display = 'block';
                }
            }

            function clearErrors() {
                const errorElements = document.querySelectorAll('.error');
                errorElements.forEach(element => {
                    element.textContent = '';
                    element.style.display = 'none';
                });
            }

            function handleResetError(error) {
                switch (error.code) {
                    case 'auth/invalid-email':
                        showError('emailError', 'Invalid email format');
                        break;
                    case 'auth/user-not-found':
                        showError('emailError', 'Email not found');
                        break;
                    case 'auth/wrong-password':
                        showError('emailError', 'Current password is incorrect');
                        break;
                    case 'auth/requires-recent-login':
                        showError('emailError', 'Please login again to change password');
                        break;
                    default:
                        showError('emailError', 'An error occurred. Please try again');
                        console.error(error);
                }
            }
        });
    </script>
</body>

</html>
